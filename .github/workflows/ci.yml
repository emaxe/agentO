name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
        exclude:
          # vitest 4 requires Node >= 20.12; the Windows build is covered by 20 and 22.
          - os: windows-latest
            node: '18'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # vitest 4 requires Node >= 20.12 (imports `styleText` from node:util).
        # On Node 18 the CLI itself is still built and smoke-tested below.
        if: matrix.node != '18'
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      - name: Upload test report
        if: failure() && matrix.node != '18'
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/junit.xml
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Smoke-check the built CLI
        run: node dist/bin/agento.js --version

      # Native-shell checks: the bash steps above do not exercise PowerShell or cmd.exe.
      - name: Smoke-check the built CLI (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node dist\bin\agento.js --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dist\bin\agento.js agent status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installs the packed tarball globally so npm generates the real agento.cmd shim.
      - name: Smoke-check the global npm shim (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "delims=" %%i in ('npm pack --silent') do set TGZ=%%i
          npm install -g "%CD%\%TGZ%" || exit /b 1
          for /f "delims=" %%p in ('npm prefix -g') do set "PATH=%%p;%PATH%"
          agento --version

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Runtime dependencies ship to users; dev-only advisories should not fail CI.
      - run: npm audit --omit=dev --audit-level=high
